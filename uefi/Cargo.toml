[package]
name = "pi4-uefi"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "The UEFI firmware the VPU firmware starts the ARM in"
publish = false

[dependencies]
r-efi = "5.3"

[features]
# ANSI colours in the log, as the VPU firmware's `color` feature.
color = []

[[bin]]
name = "pi4-uefi"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
