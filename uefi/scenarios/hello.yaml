# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "uefi-hello"
description: "The stock EEPROM bootloader and start4.elf hand the ARM to CrabEFI, which finds the SD card and runs \\EFI\\BOOT\\BOOTAA64.EFI."

boot:
  eeprom: "https://raw.githubusercontent.com/raspberrypi/rpi-eeprom/master/firmware-2711/latest/pieeprom-2026-08-04.bin"
  sd:
    files:
      start4.elf: "https://raw.githubusercontent.com/raspberrypi/firmware/1.20260915/boot/start4.elf"
      fixup4.dat: "https://raw.githubusercontent.com/raspberrypi/firmware/1.20260915/boot/fixup4.dat"
      config.txt: { inline: "arm_64bit=1\nenable_uart=1\nuart_2ndstage=1\nkernel=pi4-uefi.bin\ndtoverlay=disable-bt\n" }
      pi4-uefi.bin: "../../out/pi4-uefi.bin"
      bcm2711-rpi-4-b.dtb: "https://raw.githubusercontent.com/raspberrypi/firmware/1.20260915/boot/bcm2711-rpi-4-b.dtb"
      overlays/disable-bt.dtbo: "https://raw.githubusercontent.com/raspberrypi/firmware/1.20260915/boot/overlays/disable-bt.dtbo"
      EFI/BOOT/BOOTAA64.EFI: "../../out/hello.efi"
  boot_order: "0x1"
  bootconf:
    - "BOOT_UART=1"
  input:
    # Skip the boot menu's countdown, which takes long in the model.
    - after: "Booting in 5 seconds"
      text: "\r"
  until: "EFI app executed successfully"
  wall_secs: 900

milestones:
  - why: "start4.elf handed the ARM to the payload."
    line: "pi4-uefi: device tree at"
  - why: "CrabEFI's SDHCI driver brought up the card on EMMC2."
    line: "SDHCI: Card initialized"
  - why: "The boot manager found the removable-media path on the card."
    line: "Found 1 boot entries"
  - why: "The EFI application ran and returned."
    line: "Hello from CrabEFI!"
