[package]
name = "mailbox-efi"
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace]

[[bin]]
name = "xhci-reset"
path = "src/main.rs"

[[bin]]
name = "boot-key"
path = "src/boot_key.rs"

[[bin]]
name = "late-extend"
path = "src/late_extend.rs"

[dependencies]
r-efi = "5.3"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

[profile.dev]
panic = "abort"
