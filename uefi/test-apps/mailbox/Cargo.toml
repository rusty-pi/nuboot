[package]
name = "mailbox-efi"
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace]

[[bin]]
name = "xhci-reset"
path = "src/main.rs"

[[bin]]
name = "boot-key"
path = "src/boot_key.rs"

[[bin]]
name = "boot-key-unbound"
path = "src/boot_key_unbound.rs"

[[bin]]
name = "boot-key-unbound-b"
path = "src/boot_key_unbound_b.rs"

[[bin]]
name = "reboot-flags"
path = "src/reboot_flags.rs"

[[bin]]
name = "tpm2-test"
path = "src/tpm2_test.rs"

[dependencies]
r-efi = "5.3"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

[profile.dev]
panic = "abort"
