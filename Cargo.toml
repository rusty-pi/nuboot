[package]
name = "nuboot"
# Not the released version: nothing reads `CARGO_PKG_VERSION`, and the build
# identifies itself by its commit (build.rs).
version = "0.0.0"
edition = "2024"
license = "MIT"

[lib]
test = false
bench = false

[[bin]]
name = "start4"
test = false
bench = false

[[bin]]
name = "start4-update"
path = "src/bin/start4-update.rs"
test = false
bench = false

[features]
# Colour the console log with ANSI escapes.
color = []
# Trust the key scripts/build-uefi.sh generates in out/test-keys/ besides the
# built-in ones, and leave the image as out/start4-test.elf: the scenarios'
# EFI applications are signed with that key. Never for a real board.
test-keys = []

[dependencies]

[profile.dev]
panic = "abort"
opt-level = 2
codegen-units = 1

[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
debug = true
