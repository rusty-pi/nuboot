[build]
target = "vc4-none-elf.json"
rustc-wrapper = "scripts/rustc-vc4.sh"

[target.vc4-none-elf]
linker = "toolchain/bin/vc4-elf-gcc"
rustflags = [
  "-Clink-arg=-nostartfiles",
  "-Clink-arg=-Wl,--gc-sections",
  # rustc writes its symbols.o for the spec's `arch` (csky); it only holds
  # undefined references, so let the VC4-only ld take it.
  "-Clink-arg=-Wl,--accept-unknown-input-arch",
]

[unstable]
json-target-spec = true
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
