# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "owner-db-update"
description: "A board with signed boot, a boot.img that holds owner-db.der and its device private key fused (a test key, not a board's) finds an update capsule the builder's key signed. The bundle in it is what the update keys sign and not the owner, so the owner's db leaves the capsule to the builder's key: UEFI keeps the bundle and resets, and the VPU firmware starts it."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  eeprom_pubkey: "../out/boot-test-pubkey.bin"
  boot_order: "0x1"
  bootconf:
    - "SIGNED_BOOT=1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd:
    partitions:
      - type: esp
        format: vfat
        files:
          boot.img: "../out/boot-owner.img"
          boot.sig: "../out/boot-owner.sig"
          EFI/BOOT/BOOTAA64.EFI: "../out/hello-owner.efi"
          EFI/UpdateCapsule/next.cap: "../out/capsule-update.cap"
  until: "running as an update"
  wall_secs: 1800

milestones:
  - why: "The owner's db is in force."
    line: "db is the owner's certificate from the boot.img"
  - why: "The capsule passes, signed by the builder's key and for a later build."
    line: "capsule verified"
  - why: "The bundle is on the card and in RAM, and the reset follows."
    line: "update staged, resetting into it  version=3355443200"
  - why: "The firmware the bootloader loaded checks the update key's signature on the bundle and starts it."
    line: "starting the staged bundle  version=3355443200"
  - why: "The build the bundle carried runs, as the release it names."
    line: "release=200.0.0"
  - why: "It knows it runs as an update."
    line: "running as an update"
