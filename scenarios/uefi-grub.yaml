# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "uefi-grub"
description: "This tree's EEPROM image starts start4.elf out of the EEPROM, which starts the ARM in the UEFI firmware it carries. CrabEFI finds the SD card and starts Ubuntu's signed GRUB from \\EFI\\BOOT\\BOOTAA64.EFI."

boot:
  eeprom: "../out/pieeprom.bin"
  sd:
    files:
      EFI/BOOT/BOOTAA64.EFI: "../out/grubaa64.efi"
      EFI/ubuntu/grub.cfg: { inline: "set timeout=0\necho \"grub: read its config from the card\"\n" }
  input:
    # Skip the boot menu's countdown, which takes long in the model.
    - after: "Booting in 5 seconds"
      text: "\r"
  until: "grub: read its config from the card"
  wall_secs: 900

milestones:
  - why: "start4.elf started the ARM."
    line: "ARM started in UEFI"
  - why: "The armstub took the cores to EL2 and the primary core decompressed CrabEFI and entered it."
    line: "[CrabEFI] PL011 serial initialized"
  - why: "CrabEFI's SDHCI driver brought up the card on EMMC2 and the boot manager found the removable-media path on it."
    line: "Booting Boot Entry (eMMC)"
  - why: "GRUB started, found its prefix on the card and read grub.cfg."
    line: "grub: read its config from the card"
