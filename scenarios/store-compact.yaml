# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "store-compact"
description: "A board with its device private key fused (a test key, not a board's): an EFI application exits boot services and writes through the runtime services one variable, a signed update of db and then another variable over and over, and resets, which appends the writes to the store on the card. Two more boots write as much again, which leaves the bank more than half full. At the fourth boot UEFI starts the other bank with what the variables still need; the application finds all of it as it was, writes as much again and resets. At the fifth boot the bank the fourth started still holds the variables and the certificate in db."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  boot_order: "0x1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd: "../out/card-store-compact.img"
  until: "compact test: done"
  wall_secs: 3000

milestones:
  - why: "A signed update of db is taken at runtime, and goes to the store with the other writes."
    line: "runtime test: a signed update of db is accepted ok"
  - why: "The first boot's writes after ExitBootServices are all taken."
    line: "runtime test: another is written again and again, filling the bank ok"
  - why: "The variables are as written after the reset that appended them to the store."
    line: "runtime test: the other holds what was written last ok"
  - why: "The signed update of db is still applied."
    line: "runtime test: db still holds the certificate the signed update added ok"
  - why: "UEFI finds the bank more than half full at the fourth boot and starts the other with what the variables still need."
    line: "bank more than half full, the other started with what is still needed"
  - why: "The bank the fourth boot started holds the variable written once."
    line: "runtime test: the variable written once is there after the store started over ok"
  - why: "It holds the last write of the other variable, the third boot's."
    line: "runtime test: the other holds what was written last after the store started over ok"
  - why: "It holds the update of db, which the compaction kept with the records it was made from."
    line: "runtime test: db holds the certificate after the store started over ok"
  - why: "The fifth boot finds what the fourth wrote after the compaction."
    line: "runtime test: the other holds the last write at the end ok"
  - why: "And still the variable written once and the certificate."
    line: "runtime test: db holds the certificate at the end ok"
