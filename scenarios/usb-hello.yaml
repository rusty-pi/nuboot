# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "usb-hello"
description: "No SD card; a USB drive on the VL805's ports. start4.elf brings up the PCIe link and gives the VL805 its firmware out of the EEPROM, and the UEFI firmware's xHCI driver finds the drive and runs \\EFI\\BOOT\\BOOTAA64.EFI from it."

boot:
  eeprom: "../out/pieeprom-test.bin"
  usb:
    files:
      EFI/BOOT/BOOTAA64.EFI: "../out/hello.efi"
  until: "hello test: done"
  wall_secs: 900

milestones:
  - why: "start4.elf brought the link up and loaded the VL805's firmware."
    line: "VL805 xHCI controller up  bus=1 firmware=loaded"
  - why: "start4.elf started the ARM."
    line: "ARM started in UEFI"
  - why: "The xHCI driver found the drive and its partition."
    line: "disk found  name=usb"
  - why: "The application's signature checked out."
    line: "image verified"
  - why: "The application ran off the USB drive and finished."
    line: "hello test: done"
