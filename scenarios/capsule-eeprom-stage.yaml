# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "capsule-eeprom-stage"
description: "A capsule for the EEPROM bootloader: its boot.img carries a pieeprom.upd and pieeprom.sig, which the stock bootloader writes to the EEPROM when it boots them. The firmware stages the pair as a tryboot like a firmware update's, and saves the variable store to the card first, since the bootloader's update wipes it."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  eeprom_pubkey: "../out/boot-test-pubkey.bin"
  boot_order: "0x1"
  bootconf:
    - "SIGNED_BOOT=1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd:
    files:
      boot.img: "../out/boot-test.img"
      boot.sig: "../out/boot-test.sig"
      EFI/BOOT/BOOTAA64.EFI: "../out/hello.efi"
      EFI/UpdateCapsule/eeprom.cap: "../out/capsule-eeprom.cap"
  until: "update staged, restarting as a tryboot  version=1790000001 kind=EEPROM"
  wall_secs: 1800

milestones:
  - why: "The capsule is for the EEPROM, newer than what the flash says, and signed by the test key."
    line: "capsule verified"
  - why: "The pair and the store's copy are on the card and read back, and the reset asks for a tryboot."
    line: "update staged, restarting as a tryboot  version=1790000001 kind=EEPROM"
