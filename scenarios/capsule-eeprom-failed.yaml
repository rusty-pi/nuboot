# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "capsule-eeprom-failed"
description: "The boot after an EEPROM update the bootloader did not make (it did not accept the update, say): the record says it was pending and the EEPROM is older than the capsule said, so the firmware drops the staged pair and tells the OS it failed."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  eeprom_pubkey: "../out/boot-test-pubkey.bin"
  boot_order: "0x1"
  bootconf:
    - "SIGNED_BOOT=1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd: "../out/card-capsule-eeprom-failed.img"
  until: "hello test: done"
  wall_secs: 1800

milestones:
  - why: "The EEPROM is older than the capsule's update."
    line: "the bootloader did not update the EEPROM, update dropped  version=1790000001"
