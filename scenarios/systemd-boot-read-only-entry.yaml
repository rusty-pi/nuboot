# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "systemd-boot-read-only-entry"
description: "Debian's systemd-boot 262 and a unified kernel image `system_1+3-0.efi` with the FAT read-only attribute, which is what systemd-sysupdate's `Mode=0444` leaves on a vfat file system. systemd-boot 262 takes the attribute as a request to leave the boot counter alone: the firmware refuses the open for writing, says so on the console, and the entry starts by its own name."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  boot_order: "0x4"
  usb: "../out/esp-read-only-entry.img"
  until: "hello test: done"
  wall_secs: 900

milestones:
  - why: "The open for writing is refused, with the reason, on the console."
    line: "open for writing refused  reason=\"the file has the read-only attribute, so its boot counter stays\" path=\\EFI\\Linux\\system_1+3-0.efi"
  - why: "The entry starts by the name it has, the counter unchanged."
    line: "image verified  signer=\"nuboot test key\" db=\"nuboot test key\" path=PciRoot(0)/Pci(0,0)/Pci(0,0)/USB(1,0)/HD(1)\\EFI\\Linux\\system_1+3-0.efi"
  - why: "The kernel inside the image ran."
    line: "hello test: done"
