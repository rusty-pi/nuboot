# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "capsule-trial"
description: "The boot after a capsule's update was staged: the build the capsule carried starts, finds the record the old build left in the sealed variable store, tells the OS it succeeded and, once it reaches ExitBootServices, records the update as proven."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  eeprom_pubkey: "../out/boot-test-pubkey.bin"
  boot_order: "0x1"
  bootconf:
    - "SIGNED_BOOT=1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd: "../out/card-capsule-trial.img"
  until: "the updated firmware reached the OS  version=2147483000"
  wall_secs: 1800

milestones:
  - why: "The running build is the one the record names."
    line: "firmware updated  version=2147483000"
  - why: "It reached ExitBootServices."
    line: "the updated firmware reached the OS  version=2147483000"
