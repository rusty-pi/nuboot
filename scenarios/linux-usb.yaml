# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "linux-usb"
description: "The linux scenario booted from a USB drive, which the variable store is on: Linux writes the variable, and the runtime services bring the controller up again and write it to the drive when Linux resets the board. Debian's arm64 kernel, in a unified kernel image that Debian's systemd-boot starts, boots under the firmware with Secure Boot on, and its first process looks at what the firmware gave it: the kernel's own log of the EFI tables, the Secure Boot variables through efivarfs, the ESRT, the TPM on the VPU through the module in tools/tpm-vpu, `bootctl status`, the temperature sensor, the random number generator, the cores' performance monitors and the SMBIOS tables, and a variable it writes and finds again after it resets the board, and then it powers the board off, which start4.elf answers by stopping the ARM and waiting on the Ethernet port, and a magic packet from the network peer wakes the board. The kernel has two of the four cores (`maxcpus=2`)."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  boot_order: "0x4"
  bootconf:
    - "BOOT_UART=1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  usb:
    partitions:
      - type: esp
        format: vfat
        files:
          start4.elf: "../out/start4-test.elf"
          EFI/BOOT/BOOTAA64.EFI: "../out/systemd-bootaa64.efi"
          EFI/Linux/linux-test.efi: "../out/linux-test.efi"
          loader/loader.conf: { inline: "timeout 0\nconsole-mode keep\n" }
  magic_packet_after: "waiting for a magic packet"
  until: 'waking the board  reason="magic packet"'
  wall_secs: 3000

milestones:
  - why: "The kernel's EFI stub got a device tree, a TPM event log and an RNG seed from the firmware."
    line: "linux test: kernel log: efi: RTPROP="
  - why: "The kernel starts the second core through the spin table the device tree names."
    line: "smp: Brought up 1 node, 2 CPUs"
  - why: "The firmware told the kernel Secure Boot is on, so the kernel locked itself down."
    line: "Kernel is locked down from EFI Secure Boot"
  - why: "The runtime services answer in the OS's mapping: efivarfs mounts and reads."
    line: "linux test: efivarfs mounted"
  - why: "SecureBoot is 1."
    line: "linux test: SecureBoot 0600000001"
  - why: "SetupMode is 0, so the keys are in place."
    line: "linux test: SetupMode 0600000000"
  - why: "The ESRT has the firmware and the EEPROM bootloader."
    line: "linux test: esrt 3f8a0c5e-91d2-4b7a-a6c3-5d1e08f2b947 type 2"
  - why: "The kernel, in lockdown, loads tools/tpm-vpu signed with a key in db, and registers the TPM on the VPU as a TPM 2.0 chip."
    line: "linux test: tpm devices /dev/tpm0 /dev/tpmrm0"
  - why: "The firmware is in PCR 0."
    line: "linux test: pcr 0 extended"
  - why: "The board is in PCR 1."
    line: "linux test: pcr 1 extended"
  - why: "systemd-boot's configuration is in PCR 5."
    line: "linux test: pcr 5 extended"
  - why: "The initrd is in PCR 9."
    line: "linux test: pcr 9 extended"
  - why: "The unified kernel image is in PCR 11."
    line: "linux test: pcr 11 extended"
  - why: "The kernel reads the firmware's event log through the TPM it registered."
    line: "linux test: event log present"
  - why: "The device tree the OS has gives the network interface the address in the OTP's MAC rows."
    line: "linux test: ethernet address 02005e005301"
  - why: "systemd-boot told the OS it is the loader."
    line: "linux test: LoaderInfo systemd-boot"
  - why: "systemd-stub told the OS it is the stub, and which entry was started."
    line: "linux test: StubInfo systemd-stub"
  - why: "The entry systemd-boot started is the unified kernel image."
    line: "linux test: LoaderEntrySelected linux-test.efi"
  - why: "systemd's bootctl reads Secure Boot as enabled from the firmware's variables."
    line: "linux test: bootctl: Secure Boot: enabled"
  - why: "systemd-stub measured the unified kernel image into the TPM, which bootctl reads back from the variables the stub set."
    line: "linux test: bootctl: Measured UKI: yes"
  - why: "The temperature sensor's clock is running, as the firmware starts it: the kernel's driver for the sensor (bcm2711_thermal, on the device tree's node) reads a valid sample."
    line: "linux test: thermal zone cpu-thermal"
  - why: "The sample converts to a temperature a board can have."
    line: "linux test: temperature plausible"
  - why: "The device tree's thermal zone has its critical trip."
    line: "linux test: critical trip 110000 critical"
  - why: "The hardware random number generator is there for the kernel's iproc-rng200 driver, on the device tree's node."
    line: "linux test: hwrng iproc-rng200 registered"
  - why: "The generator gives bytes."
    line: "linux test: hwrng read 32 bytes"
  - why: "The cores' performance monitors are there, on the device tree's node."
    line: "linux test: pmu armv8_cortex_a72"
  - why: "The SMBIOS table, which the firmware offers whichever way the OS describes the board, names the maker and the model, from the device tree's `model`."
    line: "linux test: dmi product Raspberry Pi Ltd Raspberry Pi 4 Model B"
  - why: "The table has the board's serial number: eight hex digits."
    line: "linux test: dmi serial is eight hex digits"
  - why: "It is the one the VPU put in the device tree."
    line: "linux test: device tree serial is the dmi serial"
  - why: "The firmware is named by its vendor and the commit it was built from."
    line: "linux test: dmi firmware nuboot built from a commit"
  - why: "The enclosure is an embedded PC (SMBIOS type 34)."
    line: "linux test: dmi chassis type 34"
  - why: "The board has a UUID of its own."
    line: "linux test: dmi uuid 33 characters"
  - why: "The memory device is the board's SDRAM, in whole mebibytes as the chips are made."
    line: "linux test: dmi memory 8192 MiB"
  - why: "The OS's reset controller sends NOTIFY_XHCI_RESET as xhci-pci binds the VL805, and start4.elf reloads its firmware."
    line: "VL805 firmware reloaded for the OS"
  - why: "The OS's xHCI driver brings up the controller."
    line: "xhci_hcd 0000:01:00.0: new USB bus registered, assigned bus number 1"
  - why: "The OS can write a variable."
    line: "linux test: variable written"
  - why: "The OS's watchdog driver takes the power manager's watchdog, which the boot watchdog is handed to, on the device tree's node."
    line: "linux test: watchdog Broadcom BCM2835 Watchdog timer"
  - why: "The OS resets the board, and the variable it wrote is there at the next boot: the VPU sealed and kept the write."
    line: "linux test: variable survived the reset 07000000010203"
  - why: "The OS deletes the variable it wrote, which is what keeps the run repeatable on a board whose card holds the variable store."
    line: "linux test: variable removed"
  - why: "The kernel powers off through the firmware: the properties table offers ResetSystem, so the kernel has a power-off handler, which it has not without."
    line: "reboot: Power down"
  - why: "start4.elf sees the power off through the OS's NOTIFY_REBOOT and the two writes of the firmware's ResetSystem, and takes the watchdog off before it resets the board."
    line: "the OS powered the board off"
  - why: "The Ethernet MAC and PHY are up at 100 Mbit/s with the magic packet detector armed."
    line: "waiting for a magic packet  mbit_s=100 duplex=full"
  - why: "The power LED, a pin of the GPIO expander on the board's I2C bus, goes out."
    line: "the power LED is off"
  - why: "A magic packet from the network peer, for the address the OS had, wakes the board."
    line: 'waking the board  reason="magic packet"'
