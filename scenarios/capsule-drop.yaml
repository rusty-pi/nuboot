# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "capsule-drop"
description: "The boot after a staged update that never reached the OS: the build in boot.img finds the update still pending, removes tryboot.img and tryboot.sig and tells the OS the update failed."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  eeprom_pubkey: "../out/boot-test-pubkey.bin"
  boot_order: "0x1"
  bootconf:
    - "SIGNED_BOOT=1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd: "../out/card-capsule-drop.img"
  until: "hello test: done"
  wall_secs: 1800

milestones:
  - why: "The update was pending and the old build is the one running."
    line: "the updated firmware did not reach the OS, update dropped  version=2147483000"
