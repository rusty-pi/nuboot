# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "uefi-hello"
description: "The stock EEPROM bootloader starts this firmware's start4.elf off the card, in its test build. start4.elf starts the ARM in the UEFI firmware, which finds the SD card, checks the signature on \\EFI\\BOOT\\BOOTAA64.EFI against db and runs it."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  boot_order: "0x1"
  sd:
    files:
      start4.elf: "../out/start4-test.elf"
      EFI/BOOT/BOOTAA64.EFI: "../out/hello.efi"
  until: "hello test: done"
  wall_secs: 900

milestones:
  - why: "The stock bootloader started start4.elf off the card."
    line: "started by the EEPROM bootloader  medium=sd"
  - why: "start4.elf found the handover the bootloader left."
    line: "medium=sd"
  - why: "start4.elf started the ARM."
    line: "ARM started in UEFI"
  - why: "The armstub took the cores to EL2 and the primary core decompressed the UEFI firmware and entered it."
    line: "UEFI firmware started"
  - why: "The test build trusts the test key as well as the built-in keys."
    line: "Secure Boot enforced  db=4"
  - why: "The SD driver brought up the card on EMMC2."
    line: "sd       card ready"
  - why: "The application's signature chains to the test key in db."
    line: "image verified  signer=\"nuboot test key\""
  - why: "The application sees Secure Boot on."
    line: "hello test: Secure Boot is on"
  - why: "The application ran its checks and finished."
    line: "hello test: done"
