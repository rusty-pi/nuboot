# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "uefi-hello"
description: "This tree's EEPROM image, with nothing stock in it but the SDRAM training firmware, in its test build. The first stage brings up the SDRAM and starts start4.elf out of the EEPROM, which starts the ARM in the UEFI firmware. It finds the SD card, checks the signature on \\EFI\\BOOT\\BOOTAA64.EFI against db and runs it."

boot:
  eeprom: "../out/pieeprom-test.bin"
  sd:
    files:
      EFI/BOOT/BOOTAA64.EFI: "../out/hello.efi"
  until: "hello test: done"
  wall_secs: 900

milestones:
  - why: "The boot ROM entered the first stage."
    line: "pi4-server-firmware bootcode"
  - why: "The first stage loaded start4.elf out of the EEPROM after bringing up the SDRAM."
    line: "start4.elf loaded"
  - why: "start4.elf found the handover the first stage left."
    line: "medium=eeprom"
  - why: "start4.elf started the ARM."
    line: "ARM started in UEFI"
  - why: "The armstub took the cores to EL2 and the primary core decompressed the UEFI firmware and entered it."
    line: "UEFI firmware started"
  - why: "The test build trusts the test key as well as the built-in keys."
    line: "Secure Boot enforced  db=4"
  - why: "The SD driver brought up the card on EMMC2."
    line: "sd       card ready"
  - why: "The application's signature chains to the test key in db."
    line: "image verified  signer=\"pi4-server-firmware test key\""
  - why: "The application sees Secure Boot on."
    line: "hello test: Secure Boot is on"
  - why: "The application ran its checks and finished."
    line: "hello test: done"
