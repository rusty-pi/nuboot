# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "capsule-commit"
description: "The boot after a staged update proved itself: the build in boot.img finds tryboot.img and tryboot.sig beside it and the update recorded as proven, makes them boot.img and boot.sig, checks that the pair belongs together and resets into the new build."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  eeprom_pubkey: "../out/boot-test-pubkey.bin"
  boot_order: "0x1"
  bootconf:
    - "SIGNED_BOOT=1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd:
    partitions:
      - type: esp
        format: vfat
        files:
          boot.img: "../out/boot-test.img"
          boot.sig: "../out/boot-test.sig"
          tryboot.img: "../out/boot-next.img"
          tryboot.sig: "../out/boot-next.sig"
          EFI/BOOT/BOOTAA64.EFI: "../out/hello.efi"
      - type: 0ca9cdc0-6c28-49a6-a041-eeec6123df3a
        start: 512K
        size: 512K
        data: "../out/store-proven.bin"
  until: "firmware committed  version=2147483000"
  wall_secs: 1800

milestones:
  - why: "The update is proven, so the pair becomes the boot pair."
    line: "firmware committed  version=2147483000"
