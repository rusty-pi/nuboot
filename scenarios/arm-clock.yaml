# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "arm-clock"
description: "A Pi 4B rev 1.5 runs its ARM at the boosted 1800 MHz: the core rail is characterised for the die, set for the rate with the PMIC in its fast mode, and the ARM starts at it."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  boot_order: "0x1"
  sd:
    files:
      start4.elf: "../out/start4-test.elf"
      EFI/BOOT/BOOTAA64.EFI: "../out/hello.efi"
  until: "hello test: done"
  wall_secs: 600

milestones:
  - why: "The core rail is characterised and set for the board's rate, and the ARM starts at it."
    line: "ARM started in UEFI  arm_mhz=1800"
  - why: "The core rail took the setpoint."
    line: "core rail set"
