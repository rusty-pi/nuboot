# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "crypto"
description: "A board with its device private key fused (a test key, not a board's): the firmware cryptography service signs a hash and HMACs a message with it for as long as boot services last, and gives its public key, which verifies the signature. It never gives the key. Once the OS has the board, signing and HMAC are locked."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  boot_order: "0x1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd:
    partitions:
      - type: esp
        format: vfat
        files:
          start4.elf: "../out/start4-test.elf"
          EFI/BOOT/BOOTAA64.EFI: "../out/crypto.efi"
  until: "runtime test: done"
  wall_secs: 1800

milestones:
  - why: "The key is not locked at first, and reading it out is."
    line: "runtime test: the device key may sign and HMAC at first ok"
  - why: "The public key is a P-256 key on the curve."
    line: "runtime test: the public key comes as a P-256 SubjectPublicKeyInfo ok"
  - why: "The signature is the device key's: an independent verifier with the public key accepts it."
    line: "runtime test: the signature verifies against the public key ok"
  - why: "The private key is never answered."
    line: "runtime test: the private key itself is refused ok"
  - why: "From ExitBootServices the OS cannot sign with it."
    line: "runtime test: the key no longer signs ok"
