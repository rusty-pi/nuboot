# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "watchdog-hang"
description: "An EFI application asks for a one-second watchdog and hangs in boot services. UEFI stops beating the boot watchdog when the second is up, and the board resets and boots again."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  boot_order: "0x1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd:
    partitions:
      - type: esp
        format: vfat
        files:
          start4.elf: "../out/start4-test.elf"
          EFI/BOOT/BOOTAA64.EFI: "../out/watchdog-hang.efi"
  until: "watchdog test: the board reset and booted again"
  wall_secs: 900

milestones:
  - why: "start4.elf armed the boot watchdog."
    line: "boot watchdog armed  budget_s=30"
  - why: "start4.elf handed it to the ARM."
    line: "boot watchdog handed to the ARM"
  - why: "The application is running."
    line: "watchdog test: hanging in boot services"
  - why: "The application's SetWatchdogTimer set the span."
    line: "UEFI set the boot watchdog  asked_s=1 span_s=1"
  - why: "The span ran out with the boot still in UEFI, and the timer stopped beating the dog."
    line: "the boot did not finish in time, letting the board reset"
  - why: "The board reset and the application ran again: what it left in the variable store was still there."
    line: "watchdog test: the board reset and booted again"
