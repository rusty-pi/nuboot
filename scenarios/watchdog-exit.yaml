# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "watchdog-exit"
description: "An EFI application exits boot services as an operating system loader does. start4.elf takes the boot watchdog back and gives the operating system its span to take it over."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  boot_order: "0x1"
  sd:
    files:
      start4.elf: "../out/start4-test.elf"
      EFI/BOOT/BOOTAA64.EFI: "../out/watchdog-exit.efi"
  until: "is its to take over  span_s=120"
  wall_secs: 900

milestones:
  - why: "start4.elf handed the boot watchdog to the ARM."
    line: "boot watchdog handed to the ARM"
  - why: "The application is running."
    line: "watchdog test: exiting boot services"
  - why: "The UEFI firmware told start4.elf that boot services are over."
    line: "UEFI started the OS, the boot watchdog is its to take over  span_s=120"
