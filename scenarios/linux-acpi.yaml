# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "linux-acpi"
description: "The same Debian arm64 kernel as in the linux scenario, told to describe the board with the ACPI tables (acpi=on) in place of the device tree: its own TPM driver (tpm_crb, no module of ours) finds the TPM on the VPU through the TPM2 table, its generic xHCI driver finds the USB controller behind the PCIe root complex through the DSDT, and its first process looks at what it looks at there (the TPM, the Secure Boot variables, the ESRT, `bootctl status`, the temperature, the random number generator, the performance monitors and the SMBIOS tables) and at the SD card, the network interface and a USB stick, and at a variable it writes and finds again after it resets the board, and powers the board off."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  boot_order: "0x1"
  bootconf:
    - "BOOT_UART=1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd:
    files:
      start4.elf: "../out/start4-test.elf"
      EFI/BOOT/BOOTAA64.EFI: "../out/systemd-bootaa64.efi"
      EFI/Linux/linux-acpi-test.efi: "../out/linux-acpi-test.efi"
      loader/loader.conf: { inline: "timeout 0\nconsole-mode keep\n" }
  usb:
    files:
      usb-test.txt: { inline: "a stick on the VL805\n" }
  until: "Halt: wake"
  wall_secs: 3000

milestones:
  - why: "The firmware offers the ACPI tables to the OS."
    line: "tables ready  rsdp="
  - why: "The kernel took the ACPI tables over the device tree it was also given, because it was told to."
    line: "linux test: described by acpi"
  - why: "The PPTT gives the cores the 1 MiB cache they share."
    line: "linux test: l2 cache 1024K"
  - why: "The kernel reads the firmware's RSDP from the EFI configuration table."
    line: "ACPI: RSDP 0x"
  - why: "The kernel reads the SPCR table: the PL011 at its registers, at 115200 baud."
    line: "ACPI: SPCR: console: pl011,mmio32,0xfe201000,115200"
  - why: "The kernel's UART driver takes the DSDT's console device at the same registers."
    line: "ARMH0011:00: ttyAMA0 at MMIO 0xfe201000"
  - why: "The kernel starts the other three cores through the parking protocol the tables name."
    line: "smp: Brought up 1 node, 4 CPUs"
  - why: "The firmware told the kernel Secure Boot is on, so the kernel locked itself down."
    line: "Kernel is locked down from EFI Secure Boot"
  - why: "The runtime services answer in the OS's mapping: efivarfs mounts and reads."
    line: "linux test: efivarfs mounted"
  - why: "SecureBoot is 1."
    line: "linux test: SecureBoot 0600000001"
  - why: "SetupMode is 0, so the keys are in place."
    line: "linux test: SetupMode 0600000000"
  - why: "The ESRT has the firmware and the EEPROM bootloader."
    line: "linux test: esrt 3f8a0c5e-91d2-4b7a-a6c3-5d1e08f2b947 type 2"
  - why: "The kernel's own TPM driver for a CRB device binds to the TPM2 table's device: no module of ours is loaded."
    line: "linux test: tpm driver tpm_crb"
  - why: "The TPM answers as a TPM 2.0 chip, and the kernel registers its devices."
    line: "linux test: tpm devices /dev/tpm0 /dev/tpmrm0"
  - why: "The firmware is in PCR 0."
    line: "linux test: pcr 0 extended"
  - why: "The board is in PCR 1."
    line: "linux test: pcr 1 extended"
  - why: "systemd-boot's configuration is in PCR 5."
    line: "linux test: pcr 5 extended"
  - why: "The initrd is in PCR 9."
    line: "linux test: pcr 9 extended"
  - why: "The unified kernel image is in PCR 11."
    line: "linux test: pcr 11 extended"
  - why: "The kernel reads the firmware's event log through the TPM it registered."
    line: "linux test: event log present"
  - why: "systemd-boot told the OS it is the loader."
    line: "linux test: LoaderInfo systemd-boot"
  - why: "systemd-stub told the OS it is the stub, and which entry was started."
    line: "linux test: StubInfo systemd-stub"
  - why: "The entry systemd-boot started is the unified kernel image."
    line: "linux test: LoaderEntrySelected linux-acpi-test.efi"
  - why: "systemd's bootctl reads Secure Boot as enabled from the firmware's variables."
    line: "linux test: bootctl: Secure Boot: enabled"
  - why: "systemd-stub measured the unified kernel image into the TPM, which bootctl reads back from the variables the stub set."
    line: "linux test: bootctl: Measured UKI: yes"
  - why: "The kernel's driver for the SD host (sdhci-iproc) takes the BRCME88C device the DSDT describes and finds the card."
    line: "linux test: sd card "
  - why: "The kernel's driver for the network interface (genet) takes the BCM6E4E device, with the address the DSDT gives it: the one the device tree has, locally administered and unicast."
    line: "linux test: ethernet address 02ed8e73d0a4"
  - why: "The kernel's generic xHCI driver takes the USB controller the DSDT describes as a platform device, with nothing of the PCIe root complex described, and finds the interrupt line the DSDT gives it."
    line: "xhci-hcd PNP0D10:00: new USB bus registered, assigned bus number 1"
  - why: "The controller's interrupts reach the kernel: the root hub finds the VL805's own hub on its USB 2 side."
    line: "usb 1-1: New USB device found, idVendor=2109"
  - why: "The controller's DMA reaches memory the IORT and the container's _DMA allow: the stick on its SuperSpeed port answers SCSI commands."
    line: "sd 0:0:0:0: [sda] Attached SCSI removable disk"
  - why: "The stick's first sector reads back through the controller, as a partitioned disk."
    line: "linux test: usb disk boot signature 55aa"
  - why: "A bulk read of 64 MiB through the controller, into pages the kernel picks from anywhere in memory, completes: transfers to memory above the controller's reach go through the bounce buffer."
    line: "linux test: usb read 64+0 records out"
  - why: "The kernel's generic thermal driver for ACPI takes the thermal zone the DSDT describes, whose method reads the temperature sensor's register the way the firmware started it."
    line: "linux test: thermal zone acpitz"
  - why: "The sample converts to a temperature a board can have."
    line: "linux test: temperature plausible"
  - why: "The zone's critical trip is the SoC's rating, from `_CRT`."
    line: "linux test: critical trip 85000 critical"
  - why: "The kernel's driver for the hardware random number generator takes the device the DSDT names with the device tree's `compatible`."
    line: "linux test: hwrng iproc-rng200 registered"
  - why: "The generator gives bytes."
    line: "linux test: hwrng read 32 bytes"
  - why: "The cores' performance monitors are there, from the interrupts the MADT gives each core."
    line: "linux test: pmu armv8_pmuv3_0"
  - why: "Every core's performance monitor has the interrupt the MADT gives it: the kernel registers the monitor without one and only warns."
    line: "No ACPI PMU IRQ"
    absent: true
  - why: "The SMBIOS table, which an OS on the ACPI tables has instead of the device tree's `model`, names the maker and the model."
    line: "linux test: dmi product Raspberry Pi Ltd Raspberry Pi 4 Model B"
  - why: "It has the board's serial number."
    line: "linux test: dmi serial is eight hex digits"
  - why: "The firmware is named by its vendor and the commit it was built from."
    line: "linux test: dmi firmware nuboot built from a commit"
  - why: "The enclosure is an embedded PC (SMBIOS type 34)."
    line: "linux test: dmi chassis type 34"
  - why: "The board has a UUID of its own."
    line: "linux test: dmi uuid 33 characters"
  - why: "The memory device is the board's SDRAM, in whole mebibytes as the chips are made."
    line: "linux test: dmi memory 8192 MiB"
  - why: "The OS can write a variable."
    line: "linux test: variable written"
  - why: "The OS's watchdog driver takes the power manager's watchdog, which the boot watchdog is handed to: through the PRP0001 device the DSDT has."
    line: "linux test: watchdog Broadcom BCM2835 Watchdog timer"
  - why: "The OS resets the board, and the variable it wrote is there at the next boot: the VPU sealed and kept the write."
    line: "linux test: variable survived the reset 07000000010203"
  - why: "The OS deletes the variable it wrote, which is what keeps the run repeatable on a board whose flash holds the variable store."
    line: "linux test: variable removed"
  - why: "The kernel powers off through the firmware: the properties table offers ResetSystem, so the kernel has a power-off handler, which it has not without."
    line: "reboot: Power down"
  - why: "The firmware resets the board with the halt partition in PM_RSTS, and the bootloader that starts again finds it."
    line: "partition 63"
  - why: "The bootloader halts there."
    line: "Halt: wake"
