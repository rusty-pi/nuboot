# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "signed-boot-refused"
description: "boot.img signed by a key that is not the EEPROM's: the stock bootloader refuses it and does not start start4.elf."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  eeprom_pubkey: "../out/boot-test-pubkey.bin"
  boot_order: "0x1"
  bootconf:
    - "SIGNED_BOOT=1"
    - "BOOT_UART=1"
  sd:
    partitions:
      - type: esp
        format: vfat
        files:
          boot.img: "../out/boot-stranger.img"
          boot.sig: "../out/boot-stranger.sig"
  until: "Bad signature boot.img"
  wall_secs: 600

milestones:
  - why: "The bootloader found the signature wrong."
    line: "Bad signature boot.img"
