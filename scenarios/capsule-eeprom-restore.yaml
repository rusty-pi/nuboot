# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "capsule-eeprom-restore"
description: "The boot after the bootloader updated the EEPROM: the flash holds the update's time and an empty variable store, and the card still has the copy the update was staged with. The firmware puts it back, restarts, finds the update recorded as pending and the EEPROM as new as the capsule said, and tells the OS it succeeded."

boot:
  eeprom: "../out/pieeprom-stamped.bin"
  eeprom_pubkey: "../out/boot-test-pubkey.bin"
  boot_order: "0x1"
  bootconf:
    - "SIGNED_BOOT=1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd:
    files:
      boot.img: "../out/boot-test.img"
      boot.sig: "../out/boot-test.sig"
      STORE.BAK: "../out/store-eeprom.bak"
      tryboot.img: "../out/boot-eeprom.img"
      tryboot.sig: "../out/boot-eeprom.sig"
      EFI/BOOT/BOOTAA64.EFI: "../out/hello.efi"
  until: "EEPROM updated  version=1790000001"
  wall_secs: 1800

milestones:
  - why: "The store was empty and the copy comes back."
    line: "variable store restored after an EEPROM update, restarting"
  - why: "The restored record says an update was pending, and the flash says it happened."
    line: "EEPROM updated  version=1790000001"
