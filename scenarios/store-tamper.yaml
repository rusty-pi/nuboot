# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "store-tamper"
description: "A board with its device private key fused (a test key, not a board's) whose flash store was written from outside: only the records that are sealed and in sequence come back, a damaged one is stepped over, and what the OS had the VPU sign is read only for a variable of its own."

boot:
  eeprom: "../out/pieeprom-tamper.bin"
  boot_order: "0x1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd:
    files:
      start4.elf: "../out/start4-test.elf"
      EFI/BOOT/BOOTAA64.EFI: "../out/store-tamper.efi"
  until: "tamper test: done"
  wall_secs: 900

milestones:
  - why: "A record that is sealed and in sequence comes back."
    line: "tamper test: Good present"
  - why: "So does the one after it."
    line: "tamper test: Fresh present"
  - why: "A record with the wrong seal is ignored."
    line: "tamper test: Forged absent"
  - why: "A sealed record numbered below the ones before it, put back from an older copy, is ignored."
    line: "tamper test: Stale absent"
  - why: "A record whose digest does not match is not read."
    line: "tamper test: Torn absent"
  - why: "The one after it is."
    line: "tamper test: AfterTorn present"
  - why: "The OS's deletion of a variable the firmware keeps hidden from it, signed by the VPU, is ignored."
    line: "tamper test: Hidden present"
  - why: "A variable of the OS's own, signed by the VPU, comes back."
    line: "tamper test: RuntimeOk present"
  - why: "The OS's deletion of SecureBoot, signed by the VPU, is ignored."
    line: "tamper test: SecureBoot present"
