# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "capsule-stage"
description: "A board with signed boot and its device private key fused (a test key, not a board's) finds a capsule for a later firmware build on the card. It writes the capsule's boot.img and boot.sig as tryboot.img and tryboot.sig, reads them back, removes the capsule, records the update in the flash store and resets as a tryboot."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  eeprom_pubkey: "../out/boot-test-pubkey.bin"
  boot_order: "0x1"
  bootconf:
    - "SIGNED_BOOT=1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd:
    files:
      boot.img: "../out/boot-test.img"
      boot.sig: "../out/boot-test.sig"
      EFI/BOOT/BOOTAA64.EFI: "../out/hello.efi"
      EFI/UpdateCapsule/next.cap: "../out/capsule-apply.cap"
  until: "update staged, restarting as a tryboot  version=2147483000"
  wall_secs: 1800

milestones:
  - why: "The capsule is for a later build and signed by the test key."
    line: "capsule verified"
  - why: "The pair is on the card and reads back, and the reset asks for a tryboot."
    line: "update staged, restarting as a tryboot  version=2147483000"
