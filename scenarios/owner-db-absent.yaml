# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "owner-db-absent"
description: "A boot.img without owner-db.der: the built-in db and the test key are in force, as on a board that does not name one."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  eeprom_pubkey: "../out/boot-test-pubkey.bin"
  boot_order: "0x1"
  bootconf:
    - "SIGNED_BOOT=1"
  sd:
    files:
      boot.img: "../out/boot-test.img"
      boot.sig: "../out/boot-test.sig"
      EFI/BOOT/BOOTAA64.EFI: "../out/hello.efi"
  until: "hello test: done"
  wall_secs: 900

milestones:
  - why: "The bootloader verified boot.img and started start4.elf out of it."
    line: "medium=ramdisk"
  - why: "The built-in db and the test key are in db."
    line: "Secure Boot enforced  db=2"
  - why: "The application's signature chains to the test key."
    line: "image verified  signer=\"nuboot test key\""
  - why: "The application ran."
    line: "hello test: done"
