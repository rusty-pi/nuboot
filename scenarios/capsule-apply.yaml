# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "capsule-apply"
description: "A board with signed boot and its device private key fused (a test key, not a board's) finds a capsule for a later firmware build on the card. It writes the capsule's boot.img and boot.sig as tryboot.img and tryboot.sig and resets as a tryboot. The bootloader starts the new build out of them, which reaches the OS and so proves itself. After the next reset the build in boot.img finds it proven, makes the pair the boot.img and boot.sig, and resets into the new build."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  eeprom_pubkey: "../out/boot-test-pubkey.bin"
  boot_order: "0x1"
  bootconf:
    - "SIGNED_BOOT=1"
    - "BOOT_UART=1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd:
    files:
      boot.img: "../out/boot-test.img"
      boot.sig: "../out/boot-test.sig"
      EFI/BOOT/BOOTAA64.EFI: "../out/watchdog-exit.efi"
      EFI/UpdateCapsule/next.cap: "../out/capsule-apply.cap"
  input:
    - after: "firmware committed"
      text: "\r"
  until: "UEFI firmware started  commit="
  wall_secs: 3000

milestones:
  - why: "The capsule is for a later build and signed by the test key."
    line: "capsule verified"
  - why: "The pair is on the card, the update is recorded and the reset asks for a tryboot."
    line: "update staged, restarting as a tryboot"
  - why: "The bootloader started the new build out of tryboot.img."
    line: "Loading tryboot.img"
  - why: "The new build reads the record the old one left in the sealed store."
    line: "firmware updated  version=2147483000"
  - why: "It reached ExitBootServices."
    line: "the updated firmware reached the OS"
  - why: "The old build, started again from boot.img, found the update proven and committed it."
    line: "firmware committed  version=2147483000"
  - why: "The next boot is the new build, from boot.img."
    line: "UEFI firmware started  commit="
