# yaml-language-server: $schema=https://raw.githubusercontent.com/rusty-pi/pimu/main/schemas/boot-scenario.schema.json
name: "linux"
description: "Debian's arm64 kernel, in a unified kernel image that Debian's systemd-boot starts, boots under the firmware with Secure Boot on, and its first process looks at what the firmware gave it: the kernel's own log of the EFI tables, the Secure Boot variables through efivarfs, the ESRT, the TPM on the VPU through the module in tools/tpm-vpu, and a variable it writes and finds again after it resets the board."

boot:
  eeprom: "../out/stock-pieeprom.bin"
  boot_order: "0x1"
  otp_row:
    - "56=0xc0de2001"
    - "57=0xc0de3112"
    - "58=0xc0de4223"
    - "59=0xc0de5334"
    - "60=0xc0de6445"
    - "61=0xc0de7556"
    - "62=0xc0de8667"
    - "63=0xc0de9778"
  sd:
    files:
      start4.elf: "../out/start4-test.elf"
      EFI/BOOT/BOOTAA64.EFI: "../out/systemd-bootaa64.efi"
      EFI/Linux/linux-test.efi: "../out/linux-test.efi"
      loader/loader.conf: { inline: "timeout 0\nconsole-mode keep\n" }
  until: "linux test: done"
  wall_secs: 3000

milestones:
  - why: "The kernel's EFI stub got a device tree, a TPM event log and an RNG seed from the firmware."
    line: "linux test: kernel log: efi: RTPROP="
  - why: "The firmware told the kernel Secure Boot is on, so the kernel locked itself down."
    line: "Kernel is locked down from EFI Secure Boot"
  - why: "The runtime services answer in the OS's mapping: efivarfs mounts and reads."
    line: "linux test: efivarfs mounted"
  - why: "SecureBoot is 1."
    line: "linux test: SecureBoot 0600000001"
  - why: "SetupMode is 0, so the keys are in place."
    line: "linux test: SetupMode 0600000000"
  - why: "The ESRT has the firmware and the EEPROM bootloader."
    line: "linux test: esrt 3f8a0c5e-91d2-4b7a-a6c3-5d1e08f2b947 type 2"
  - why: "The kernel, in lockdown, loads tools/tpm-vpu signed with a key in db, and registers the TPM on the VPU as a TPM 2.0 chip."
    line: "linux test: tpm devices /dev/tpm0 /dev/tpmrm0"
  - why: "The firmware is in PCR 0."
    line: "linux test: pcr 0 extended"
  - why: "The board is in PCR 1."
    line: "linux test: pcr 1 extended"
  - why: "systemd-boot's configuration is in PCR 5."
    line: "linux test: pcr 5 extended"
  - why: "The initrd is in PCR 9."
    line: "linux test: pcr 9 extended"
  - why: "The unified kernel image is in PCR 11."
    line: "linux test: pcr 11 extended"
  - why: "The kernel reads the firmware's event log through the TPM it registered."
    line: "linux test: event log present"
  - why: "The device tree the OS has gives the network interface an address, locally administered and unicast."
    line: "linux test: ethernet address 02"
  - why: "systemd-boot told the OS it is the loader."
    line: "linux test: LoaderInfo systemd-boot"
  - why: "systemd-stub told the OS it is the stub, and which entry was started."
    line: "linux test: StubInfo systemd-stub"
  - why: "The entry systemd-boot started is the unified kernel image."
    line: "linux test: LoaderEntrySelected linux-test.efi"
  - why: "The OS can write a variable."
    line: "linux test: variable written"
  - why: "The OS resets the board, and the variable it wrote is there at the next boot: the VPU signed and kept the write."
    line: "linux test: variable survived the reset 07000000010203"
