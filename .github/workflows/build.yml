name: build

# Every push builds start4.elf and boots each scenario in `scenarios/` in pimu
# under Raspberry Pi's EEPROM bootloader.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # `RUNNER_BUILD` names a self-hosted pool. Its image is `ubuntu:26.04`, the
    # release the toolchain packages are built for, and without the variable
    # this runs on GitHub's own runner of that release.
    runs-on: ${{ vars.RUNNER_BUILD || 'ubuntu-26.04' }}
    timeout-minutes: 60
    env:
      VC4_PREFIX: /opt/vc4
      CLONE_BASE: https://github.com/
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the toolchain
        run: scripts/install-toolchain.sh

      # scripts/mkbootimg.py makes the signed boot.img (with mtools and
      # dosfstools),
      # scripts/build-uefi.sh signs the test applications with sbsign, and
      # scripts/build-linux-test.sh builds the initramfs's helper with the
      # cross compiler and its C library.
      - name: Install Python, sbsigntool and the cross compiler
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 sbsigntool openssl mtools dosfstools make gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      # The action brings rustup itself, which a self-hosted runner has only
      # once something has installed it; the toolchain built with is the one
      # rust-toolchain.toml pins.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Install Rust
        run: |
          rustup toolchain install
          # The nightly the UEFI firmware start4.elf carries is built with.
          (cd uefi && rustup toolchain install)

      # rustc_codegen_gcc only depends on the commit and the libgccjit
      # scripts/toolchain.env pins and the nightly it is built with.
      - name: Codegen cache key
        id: key
        run: echo "key=codegen-${{ runner.environment }}-${{ hashFiles('scripts/build-codegen.sh', 'scripts/toolchain.env', 'rust-toolchain.toml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore codegen
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ steps.key.outputs.key }}
          path: ~/src/rustc_codegen_gcc/target/release/librustc_codegen_gcc.so

      - name: Build codegen
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          rustup component add rustc-dev llvm-tools-preview
          scripts/build-codegen.sh

      - name: Save codegen
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ steps.key.outputs.key }}
          path: ~/src/rustc_codegen_gcc/target/release/librustc_codegen_gcc.so

      # The firmware's own PK, KEK and db certificates, base64 DER, and the
      # update key's public half, base64 of its 64 bytes, from the repository's
      # secrets. Without them the build makes keys of its own, which sign
      # nothing a board will trust.
      - name: Secure Boot certificates
        env:
          PK: ${{ secrets.PI4_PK_CERT }}
          KEK: ${{ secrets.PI4_KEK_CERT }}
          DB: ${{ secrets.PI4_DB_CERT }}
          UPDATE: ${{ secrets.PI4_UPDATE_PUB }}
        run: |
          [ -n "$PK" ] && [ -n "$KEK" ] && [ -n "$DB" ] || exit 0
          mkdir -p "$RUNNER_TEMP/certs"
          for name in PK KEK DB; do
            eval "value=\$$name"
            echo "$value" | base64 -d >"$RUNNER_TEMP/certs/$name.der"
            echo "PI4_${name}_CERT=$RUNNER_TEMP/certs/$name.der" >> "$GITHUB_ENV"
          done
          if [ -n "$UPDATE" ]; then
            echo "$UPDATE" | base64 -d >"$RUNNER_TEMP/certs/update.pub"
          else
            openssl ecparam -name prime256v1 -genkey -noout -out "$RUNNER_TEMP/certs/update.key"
            openssl ec -in "$RUNNER_TEMP/certs/update.key" -pubout -outform DER | tail -c 64 >"$RUNNER_TEMP/certs/update.pub"
          fi
          echo "PI4_UPDATE_PUB=$RUNNER_TEMP/certs/update.pub" >> "$GITHUB_ENV"

      - name: Build
        run: |
          scripts/setup-toolchain.sh
          # The scenarios' EFI applications, signed with the test key, and
          # the image that trusts it beside the one that goes on a board.
          scripts/build-uefi.sh --test-apps
          scripts/build.sh
          scripts/build.sh --test-keys
          scripts/build-capsule-test.sh
          scripts/build-bundle-test.sh
          scripts/build-linux-test.sh
          # The optional features have to keep building too.
          cargo build --release --features color

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firmware
          path: |
            out/stock-pieeprom.bin
            out/pieeprom-tamper.bin
            out/pieeprom-pending.bin
            out/pieeprom-proven.bin
            out/boot-next.img
            out/boot-next.sig
            out/capsule-apply.cap
            out/capsule-eeprom.cap
            out/boot-eeprom.img
            out/boot-eeprom.sig
            out/pieeprom-eeprom-pending.bin
            out/pieeprom-stamped.bin
            out/store-eeprom.bak
            out/store-tamper.efi
            out/start4.elf
            out/start4-test.elf
            out/boot-test.img
            out/boot-test.sig
            out/boot-test-pubkey.bin
            out/boot-stranger.img
            out/boot-stranger.sig
            out/capsule-new.cap
            out/capsule-old.cap
            out/capsule-corrupt.cap
            out/capsule-stranger.cap
            out/capsule-relabeled.cap
            out/capsule-junk.cap
            out/capsule-update.cap
            out/bundle-next.bin
            out/capsule-update-stranger.cap
            out/runtime-variables.efi
            out/crypto.efi
            out/persist.efi
            out/store-compact.efi
            out/runtime-shutdown.efi
            out/linux-test.efi
            out/linux-acpi-test.efi
            out/linux-no-dt-test.efi
            out/linux-wdat-test.efi
            out/hello.efi
            out/watchdog-hang.efi
            out/watchdog-exit.efi
            out/watchdog-takeover.efi
            out/watchdog-stuck.efi
            out/watchdog-fault.efi
            out/xhci-reset.efi
            out/reboot-flags.efi
            out/gpio-tags.efi
            out/tpm2-test.efi
            out/store-enroll.efi
            out/store-enrolled.efi
            out/db-x.auth
            out/db-bad.auth
            out/shimaa64.efi
            out/shimaa64-stock.efi
            out/systemd-bootaa64.efi
            out/uki.efi
            out/grubaa64.efi
          if-no-files-found: error
          retention-days: 7

  # The ACPI tables on the host: their links and checksums, and the ACPICA
  # tools' disassembly and recompilation of the DSDT; and the SMBIOS tables,
  # which dmidecode reads.
  acpi:
    runs-on: ${{ vars.RUNNER_BOOT || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Install acpica-tools and dmidecode
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends acpica-tools dmidecode
      - name: Test
        run: scripts/test-acpi.sh

  # The TPM's code on the host: its crypto against reference vectors, and the
  # whole TPM driven by tpm2-tools and systemd-cryptenroll over the
  # simulator's socket protocol.
  tpm:
    runs-on: ${{ vars.RUNNER_BOOT || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Install tpm2-tools and cryptsetup
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tpm2-tools cryptsetup-bin
      - name: Test
        run: scripts/test-tpm.sh

  # Every `scenarios/*.yaml` runs, so a new scenario needs no edit here. They
  # are dealt out to `SCENARIO_SHARDS` jobs, the Linux ones first so that
  # they start at once and are spread over the jobs, and each job boots as
  # many at a time as it has CPUs.
  scenarios:
    runs-on: ${{ vars.RUNNER_BOOT || 'ubuntu-24.04' }}
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: list
        env:
          SHARDS: ${{ vars.SCENARIO_SHARDS || 2 }}
        run: |
          names=$(basename -s .yaml scenarios/*.yaml | sort)
          matrix=$({ grep '^linux' <<<"$names"; grep -v '^linux' <<<"$names"; } |
            jq -R . | jq -sc --argjson n "$SHARDS" '
              [to_entries[] | {shard: (.key % $n), name: .value}]
              | group_by(.shard)
              | map({shard: (.[0].shard + 1), scenarios: map(.name) | join(" ")})')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  scenario:
    needs: [build, scenarios]
    # `RUNNER_BOOT` names a self-hosted pool. pimu's release is built on
    # ubuntu-24.04, so that is the hosted fallback.
    runs-on: ${{ vars.RUNNER_BOOT || 'ubuntu-24.04' }}
    timeout-minutes: 60
    name: scenarios (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scenarios.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: firmware
          path: out

      - uses: rusty-pi/pimu@main

      - name: Boot the scenarios
        env:
          SCENARIOS: ${{ matrix.scenarios }}
        run: scripts/run-scenarios.sh $SCENARIOS
